name: verify-foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean dependency install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and static contract tests
        run: npm test
      - name: PostgreSQL RLS and constraint contract tests
        run: npm run test:db
      - name: Production build
        run: npm run build
      - name: Cloudflare candidate dry-run
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_real
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run candidate:preflight 2>&1 | tee candidate-preflight.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Wrangler diagnostic log"
            {
              echo
              echo "===== WRANGLER INTERNAL LOGS ====="
              find "$HOME/.config/.wrangler/logs" -maxdepth 1 -type f -name 'wrangler-*.log' -print -exec cat {} \; 2>/dev/null || true
            } | tee -a candidate-preflight.log
            echo "::endgroup::"
          fi
          exit "$status"
      - name: Upload Cloudflare candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-candidate-diagnostic
          path: candidate-preflight.log
          retention-days: 1
          if-no-files-found: error
      - name: Install Chromium
        shell: bash
        run: |
          # GitHub-hosted runner images may register Google Chrome through either
          # legacy .list files or deb822 .sources files. Playwright's bundled
          # Chromium does not use that third-party repository. Remove only source
          # definitions that actually point at Chrome before Playwright resolves
          # its Ubuntu dependencies; keep the dependency/browser install strict.
          while IFS= read -r source_file; do
            echo "Removing unrelated Chrome APT source: $source_file"
            sudo rm -f "$source_file"
          done < <(sudo grep -IlR 'dl\.google\.com/linux/chrome-stable' /etc/apt/sources.list.d 2>/dev/null || true)
          npx playwright install --with-deps chromium
      - name: Foundation E2E
        run: npm run test:e2e
      - name: Production Artifact E2E
        run: npm run test:e2e:production

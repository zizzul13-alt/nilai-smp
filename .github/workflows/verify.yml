name: commit-lockfile-once

on:
  push:
    branches: [r3.0-codex-01-foundation]

permissions:
  contents: write
  actions: read

jobs:
  commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r3.0-codex-01-foundation
      - name: Download previously generated lockfile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .lockfile-artifact
          mkdir .lockfile-artifact
          gh run download 33735206865 --repo "$GITHUB_REPOSITORY" --name package-lock --dir .lockfile-artifact
          cp .lockfile-artifact/package-lock.json package-lock.json
          rm -rf .lockfile-artifact
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already committed"
            exit 0
          fi
          git commit -m "Commit package-lock for reproducible installs"
          git push origin HEAD:r3.0-codex-01-foundation

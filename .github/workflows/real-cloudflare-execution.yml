name: real-cloudflare-execution

on:
  push:
    branches:
      - ops/f2.1-production-deploy-repair-20260912

permissions:
  contents: read

concurrency:
  group: nilai-smp-real-cloudflare-execution
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ifnnmmilurqtvvxywrlo.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jx_jctLO1T0Bcn4juuRc0w_coYKu2g_
      CF_ACCOUNT_ID_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID_LEGACY: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN_LEGACY: ${{ secrets.CF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24716b2f610d76802d1da45ee40325b9bae94e36

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean dependency install
        run: npm ci --no-audit --no-fund

      - name: Require permanent Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          account_id="${CF_ACCOUNT_ID_PRIMARY:-${CF_ACCOUNT_ID_LEGACY:-}}"
          api_token="${CF_API_TOKEN_PRIMARY:-${CF_API_TOKEN_LEGACY:-}}"
          if [ -z "$account_id" ] || [ -z "$api_token" ]; then exit 78; fi
          echo "::add-mask::$account_id"
          echo "::add-mask::$api_token"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$api_token" >> "$GITHUB_ENV"

      - name: Exact candidate preflight
        run: npm run candidate:preflight

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Deploy exact F2.1 repaired candidate
        id: deploy
        env:
          WRANGLER_OUTPUT_FILE_PATH: wrangler.ndjson
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --message "Nilai SMP F2.1 repaired exact candidate 24716b2f610d76802d1da45ee40325b9bae94e36"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const records=readFileSync('wrangler.ndjson','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const deploy=[...records].reverse().find(r=>r.type==='deploy');
          if(!deploy?.version_id) throw new Error('missing version_id');
          const url=deploy.targets?.find(t=>typeof t==='string'&&t.startsWith('https://'));
          if(!url) throw new Error('missing deployment URL');
          appendFileSync(process.env.GITHUB_OUTPUT,`version_id=${deploy.version_id}\nurl=${url}\n`);
          console.log(`F2_1_REPAIRED_DEPLOY PASS version=${deploy.version_id} url=${url}`);
          NODE

      - name: Public URL and deep-SPA smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if npm run candidate:smoke -- "${{ steps.deploy.outputs.url }}"; then exit 0; fi
            [ "$attempt" -eq 12 ] && exit 1
            sleep 5
          done

      - name: Teacher Brief API worker-first protection smoke
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}/api/teacher-brief"
          status="$(curl -sS -o teacher-brief-unauth.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"context":{}}' "$url")"
          cat teacher-brief-unauth.json
          if [ "$status" != "401" ]; then
            echo "::error::expected unauthenticated Teacher Brief API to return 401, got $status"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const body=JSON.parse(readFileSync('teacher-brief-unauth.json','utf8'));
          if(body?.error!=='unauthorized') throw new Error(`unexpected Teacher Brief API body: ${JSON.stringify(body)}`);
          console.log('F2_1_API_WORKER_FIRST=PASS error=unauthorized');
          NODE

      - name: Desktop and mobile browser smoke
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const origin=new URL(process.env.DEPLOYED_URL); const browser=await chromium.launch();
          try {
            for (const viewport of [{width:1280,height:900},{width:390,height:844}]) {
              const page=await browser.newPage({viewport}); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              for (const path of ['/','/__f2_1_repaired_deep_spa_probe__/browser']) {
                const response=await page.goto(new URL(path,origin).href,{waitUntil:'domcontentloaded'});
                if(!response||response.status()!==200) throw new Error(`${path} != 200`);
                await page.waitForSelector('#root',{timeout:10000});
                const html=await page.content(); if(html.includes('/src/')||html.includes('/@vite/client')) throw new Error('dev path exposed');
              }
              if(errors.length) throw new Error(errors.join(' | ')); await page.close();
            }
            console.log(`F2_1_BROWSER_SMOKE PASS origin=${origin.origin}`);
          } finally { await browser.close(); }
          NODE

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          cat > f2-1-production-deploy.txt <<EOF
          F2_1_PRODUCTION_DEPLOY=PASS
          exact_candidate_sha=24716b2f610d76802d1da45ee40325b9bae94e36
          schema_version=r3.6-recovery.1
          supabase_project_ref=ifnnmmilurqtvvxywrlo
          deployed_url=${{ steps.deploy.outputs.url }}
          deployed_version=${{ steps.deploy.outputs.version_id }}
          workers_ai_binding=CONFIG_AND_DEPLOY_PASS
          worker_first_routing=PASS
          teacher_brief_api_unauth_protection=PASS
          public_desktop_mobile_smoke=PASS
          authenticated_workers_ai_smoke=NOT_CLAIMED
          deterministic_fallback_runtime_smoke=NOT_CLAIMED
          PRODUCTION_CUTOVER=FALSE
          EOF
          cat f2-1-production-deploy.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-1-production-deploy-repaired-evidence
          path: |
            wrangler.ndjson
            teacher-brief-unauth.json
            f2-1-production-deploy.txt
          if-no-files-found: warn
          retention-days: 7
